# Copy to .workit.yml for repository-specific settings.
provider: auto

# Optional when the repository has multiple GitHub remotes.
# github:
#   repo: banyudu/example

worktree:
  branchPrefix: yudu
  baseBranch: auto
  directory: .worktrees

launch:
  target: banyan
  dependencies: symlink
  review: true
  handoff: true

